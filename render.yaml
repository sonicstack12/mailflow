# Optional Blueprint — or add the same Rewrite manually in each Static Site:
# Redirects/Rewrites → Source: /*  Destination: /index.html  Action: Rewrite
services:
  - type: web
    name: mailflow-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: mailflow-customer
    runtime: static
    rootDir: customer_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: mailflow-admin
    runtime: static
    rootDir: admin_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
